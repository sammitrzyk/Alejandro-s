<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Alejandro's Landscaping</title>
<link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%}.tile{width:1280px;height:854px;display:flex}.main{flex:0 0 75%;background:var(--green-800);display:grid;place-items:center;padding:0 64px}.main img{width:100%;max-width:760px;height:auto;filter:brightness(0) invert(1)}.strip{flex:1;display:flex;flex-direction:column}.strip div{flex:1}</style>
</head><body>
<div class="tile">
<div class="main"><img src="assets/logo.png" alt="Alejandro's Landscaping"></div>
<div class="strip">
<div style="background:var(--gold-300)"></div>
<div style="background:var(--gold-500)"></div>
<div style="background:var(--lime-500)"></div>
<div style="background:var(--green-950)"></div>
</div>
</div>
</body></html>
