[build]
base = "astro"
publish = "dist"
command = "npm run build"

[build.environment]
NODE_VERSION = "20"

[[redirects]]
from = "/hardscaping"
to = "/hardscaping/paver-patios/"
status = 301

[[redirects]]
from = "/maintenance"
to = "/commercial-landscaping/"
status = 301

[[redirects]]
from = "/landscaping"
to = "/landscaping/installation/"
status = 301

[[headers]]
for = "/*"
  [headers.values]
  X-Frame-Options = "SAMEORIGIN"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
