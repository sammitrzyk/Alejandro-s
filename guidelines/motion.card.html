<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Motion</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font:var(--type-body)}.r{display:flex;gap:0;align-items:stretch}.sw{flex:1;height:74px;display:flex;align-items:flex-end;padding:8px;font:var(--type-caption);font-size:11px}.lb{display:flex;flex-direction:column;gap:2px;font:var(--type-caption);font-size:11px;color:var(--text-muted);margin-top:8px}.tok{font-family:var(--font-sans);font-size:11px;color:var(--text-muted)}.grid{display:grid;gap:14px}</style></head><body><div style="display:flex;gap:20px;flex-wrap:wrap;font:var(--type-small);color:var(--text-secondary)">
<div><b style="color:var(--text-primary)">Scroll reveal</b><div class="tok">opacity 0→1, translateY 18px→0<br>--dur-reveal 800ms · --ease-out</div></div>
<div><b style="color:var(--text-primary)">Image hover</b><div class="tok">scale(1.03) over --dur-slow 600ms</div></div>
<div><b style="color:var(--text-primary)">Control hover</b><div class="tok">colour only, --dur-fast 200ms</div></div>
<div><b style="color:var(--text-primary)">Reduced motion</b><div class="tok">all durations → 0ms, distance → 0</div></div>
</div><div class="lb"><span class="tok">--ease-out cubic-bezier(.22,.61,.36,1) is the only easing used for entrances.</span></div></body></html>
