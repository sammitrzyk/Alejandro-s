<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Elevation</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font:var(--type-body)}.r{display:flex;gap:0;align-items:stretch}.sw{flex:1;height:74px;display:flex;align-items:flex-end;padding:8px;font:var(--type-caption);font-size:11px}.lb{display:flex;flex-direction:column;gap:2px;font:var(--type-caption);font-size:11px;color:var(--text-muted);margin-top:8px}.tok{font-family:var(--font-sans);font-size:11px;color:var(--text-muted)}.grid{display:grid;gap:14px}</style></head><body><div style="display:flex;gap:16px">
<div style="flex:1;height:78px;background:var(--surface-raised);border:1px solid var(--border-hairline);display:grid;place-items:center;font:var(--type-caption)">hairline (default)</div>
<div style="flex:1;height:78px;background:var(--surface-raised);box-shadow:var(--shadow-lift);display:grid;place-items:center;font:var(--type-caption)">--shadow-lift</div>
<div style="flex:1;height:78px;background:var(--surface-raised);box-shadow:var(--shadow-panel);display:grid;place-items:center;font:var(--type-caption)">--shadow-panel (nav)</div>
</div><div class="lb"><span class="tok">Project tiles and service rows use no shadow at all — the photograph is the object.</span></div></body></html>
