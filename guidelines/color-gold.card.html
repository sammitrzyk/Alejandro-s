<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Gold accent</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font:var(--type-body)}.r{display:flex;gap:0;align-items:stretch}.sw{flex:1;height:74px;display:flex;align-items:flex-end;padding:8px;font:var(--type-caption);font-size:11px}.lb{display:flex;flex-direction:column;gap:2px;font:var(--type-caption);font-size:11px;color:var(--text-muted);margin-top:8px}.tok{font-family:var(--font-sans);font-size:11px;color:var(--text-muted)}.grid{display:grid;gap:14px}</style></head><body><div class="r"><div class="sw" style="background:var(--gold-600);color:#fff">600 · rules</div><div class="sw" style="background:var(--gold-text);color:#fff">text-safe</div><div class="sw" style="background:var(--gold-500);color:#0A2416">500 · accent</div><div class="sw" style="background:var(--gold-300);color:#0A2416">300</div><div class="sw" style="background:var(--gold-100);color:#0A2416">100</div><div class="sw" style="background:var(--lime-500);color:#0A2416">lime · logo only</div></div><div class="r"><div class="sw" style="height:auto;padding:6px 8px 0" ><span class="tok">--gold-600</span></div><div class="sw" style="height:auto;padding:6px 8px 0" ><span class="tok">--gold-text</span></div><div class="sw" style="height:auto;padding:6px 8px 0" ><span class="tok">--gold-500</span></div><div class="sw" style="height:auto;padding:6px 8px 0" ><span class="tok">--gold-300</span></div><div class="sw" style="height:auto;padding:6px 8px 0" ><span class="tok">--gold-100</span></div><div class="sw" style="height:auto;padding:6px 8px 0" ><span class="tok">--lime-500</span></div></div></body></html>
