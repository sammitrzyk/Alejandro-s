<!-- @dsCard group="Colors" viewport="700x170" name="Semantic roles" subtitle="Surfaces, text and lines — always reference these, not the raw ramps" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Semantic roles</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font:var(--type-body)}.r{display:flex;gap:0;align-items:stretch}.sw{flex:1;height:74px;display:flex;align-items:flex-end;padding:8px;font:var(--type-caption);font-size:11px}.lb{display:flex;flex-direction:column;gap:2px;font:var(--type-caption);font-size:11px;color:var(--text-muted);margin-top:8px}.tok{font-family:var(--font-sans);font-size:11px;color:var(--text-muted)}.grid{display:grid;gap:14px}</style></head><body><div class="grid" style="grid-template-columns:repeat(4,1fr)">
<div><div style="height:52px;background:var(--surface-page);border:1px solid var(--border-hairline)"></div><div class="lb"><b>--surface-page</b>Default page ground</div></div>
<div><div style="height:52px;background:var(--surface-raised);border:1px solid var(--border-hairline)"></div><div class="lb"><b>--surface-raised</b>Header, forms, cards</div></div>
<div><div style="height:52px;background:var(--surface-sunken);border:1px solid var(--border-hairline)"></div><div class="lb"><b>--surface-sunken</b>Alternating band</div></div>
<div><div style="height:52px;background:var(--surface-dark)"></div><div class="lb"><b>--surface-dark</b>Dark band, footer</div></div>
<div><div style="height:52px;background:var(--cta-bg)"></div><div class="lb"><b>--cta-bg</b>Primary action</div></div>
<div><div style="height:52px;background:var(--cta-accent-bg)"></div><div class="lb"><b>--cta-accent-bg</b>One per screen</div></div>
<div><div style="height:52px;background:var(--surface-raised);border-bottom:1px solid var(--border-hairline);border-top:1px solid var(--border-strong)"></div><div class="lb"><b>--border-hairline / strong</b>Section rules</div></div>
<div><div style="height:52px;background:var(--status-emergency)"></div><div class="lb"><b>--status-emergency</b>Storm / urgent tree work</div></div>
</div></body></html>
