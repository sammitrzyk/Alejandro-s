<script type="text/babel">
const PAGES = [["home","Home",()=>window.Home],["paver-patios","Patios",()=>window.PaverPatios],["service-area","Areas",()=>window.ServiceArea],["snow-removal","Snow",()=>window.SnowRemoval],["resources","Resources",()=>window.Resources],["faqs","FAQs",()=>window.FaqCenter],["projects","Projects",()=>window.Projects],["about","About",()=>window.About]];
const SERVICES = ()=>Object.assign({}, window.SERVICES_HARDSCAPE, window.SERVICES_LANDSCAPE, window.SERVICES_OTHER);
const SERVICE_LABELS = {"paver-driveways":"Paver driveways","retaining-walls":"Retaining walls","walkways-steps":"Walkways & steps","fire-features-seat-walls":"Fire features","grading-drainage":"Grading & drainage","landscape-installation":"Landscape installation","mulch-bed-work":"Mulch & beds","shrub-hedge-trimming":"Trimming","yard-cleanups":"Spring & fall cleanups","sod-installation":"Sod installation","christmas-light-installation":"Christmas lights","landscape-lighting":"Landscape lighting","commercial-landscaping":"Commercial landscaping"};
const ALIASES = {"walkways":"walkways-steps","fire-features":"fire-features-seat-walls","drainage":"grading-drainage","installation":"landscape-installation","mulch-beds":"mulch-bed-work","lawn-installation":"sod-installation","christmas-lights":"christmas-light-installation","holiday-lighting":"christmas-light-installation","trimming":"shrub-hedge-trimming","cleanups":"yard-cleanups","property-cleanups":"yard-cleanups","landscaping":"commercial-landscaping","service-areas":"service-area"};
function App(){
  const [page,setPage]=React.useState("home");
  React.useEffect(()=>{window.scrollTo(0,0)},[page]);
  React.useEffect(()=>{ if(!page.includes(":")) window.applySeo(page); },[page]);
  window.__setPage=setPage;
  const go=(href)=>{
    const raw=String(href);
    if(/^(#estimate|\/estimate|\/contact)\b/.test(raw)){const el=document.getElementById("estimate");if(el)window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-80,behavior:"smooth"});return;}
    const parts=raw.replace(/^\//,"").split("#")[0].split("/").filter(Boolean);
    let slug=parts.pop()||"home";
    if(parts[0]==="resources"&&slug!=="faqs") slug="resources";
    if((parts[0]==="service-areas"||parts[0]==="service-area")&&(window.TOWNS_DATA||[]).some(t=>t.slug===slug)){setPage("town:"+slug);return;}
    if(parts[0]==="projects"&&(window.PROJECT_STUDIES||[]).some(p=>p.slug===slug)){setPage("project:"+slug);return;}
    slug={"hardscaping":"paver-patios","maintenance":"commercial-landscaping"}[slug]||ALIASES[slug]||slug;
    if(slug==="faqs"||slug==="resources"||PAGES.some(p=>p[0]===slug)||SERVICES()[slug]) setPage(slug);
    else console.warn("No page for",raw);
  };
  const svc=SERVICES()[page];
  const BESPOKE={"yard-cleanups":()=>window.YardCleanups,"shrub-hedge-trimming":()=>window.ShrubTrimming,"trimming":()=>window.ShrubTrimming,"commercial-landscaping":()=>window.CommercialLandscaping,"walkways":()=>window.WalkwaysSteps,"walkways-steps":()=>window.WalkwaysSteps,"retaining-walls":()=>window.RetainingWalls,"paver-driveways":()=>window.PaverDriveways,"landscape-installation":()=>window.LandscapeInstallation,"mulch-bed-work":()=>window.MulchBedWork};
  const Bespoke=page.startsWith("town:")?((p)=><window.TownPage {...p} slug={page.slice(5)}/>):page.startsWith("project:")?((p)=><window.ProjectPage {...p} slug={page.slice(8)}/>):BESPOKE[page]&&BESPOKE[page]();
  const Current=(svc||Bespoke)?null:(PAGES.find(p=>p[0]===page)||PAGES[0])[2]();
  return (<>
    {Bespoke?<Bespoke go={go}/>:svc?<window.ServicePage go={go} data={svc}/>:<Current go={go}/>}
    <MobileCallBar phone={PHONE} estimateHref="#estimate"/>
    <div id="switch">
      {PAGES.map(([slug,label])=>(
        <button key={slug} aria-pressed={page===slug} onClick={()=>setPage(slug)}>{label}</button>
      ))}
      <select aria-label="Service pages" value={SERVICE_LABELS[page]?page:""} onChange={e=>e.target.value&&setPage(e.target.value)}>
        <option value="">Services…</option>
        {Object.entries(SERVICE_LABELS).map(([slug,label])=>(<option key={slug} value={slug}>{label}</option>))}
      </select>
    </div>
  </>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
/* Hides [VERIFY …] / [ADD …] editor notes from visitors. Add ?review to the URL to see them.
   A row or section left with no real content is hidden with its note. */
(function(){
  if(/[?&]review\b/.test(location.search)) return;
  var RE=/\[(?:VERIFY|ADD|CONTENT NEEDED)[^\]]*\]\s*/g, root=document.getElementById("root");
  function media(el){return el.matches&&el.matches("img,svg,video,picture,input,select,textarea")||(el.querySelector&&el.querySelector("img,svg,video,picture,input,select,textarea"));}
  function visText(el){var t="";for(var c=el.firstChild;c;c=c.nextSibling){if(c.nodeType===3)t+=c.nodeValue;else if(c.nodeType===1&&c.style.display!=="none")t+=visText(c);}return t.trim();}
  function collapse(el){
    for(var i=0;el&&el!==root&&i<8;i++){
      if(media(el))return;
      if(i>0&&el.querySelector("h1,h2,h3,h4,h5,h6")&&el.parentElement&&media(el.parentElement))return;
      var t=visText(el);
      if(i===0?t.length===0:t.length<=48){el.style.display="none";el=el.parentElement;}else return;
    }
  }
  function clean(node){
    if(!node)return;
    var w=document.createTreeWalker(node.nodeType===3?node.parentNode:node,NodeFilter.SHOW_TEXT),n,hit=[];
    while((n=w.nextNode())){if(n.nodeValue.indexOf("[")>-1&&RE.test(n.nodeValue))hit.push(n);RE.lastIndex=0;}
    hit.forEach(function(t){t.nodeValue=t.nodeValue.replace(RE,"").replace(/^\s*[—–-]\s*/,"");collapse(t.parentElement);});
  }
  new MutationObserver(function(ms){ms.forEach(function(m){if(m.type==="characterData")clean(m.target);else m.addedNodes.forEach(clean);});})
    .observe(root,{childList:true,subtree:true,characterData:true});
  clean(root);
})();
</script>
